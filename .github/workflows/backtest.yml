name: Backtest

# Manuell oder automatisch, wenn sich die Konfiguration oder die Engine ändert.
# Braucht data/weekly.json, also mindestens einen erfolgreichen Wochenlauf.

on:
  workflow_dispatch:
    inputs:
      sensitivity:
        description: "Empfindlichkeit prüfen (jede Schwelle ±15 %, dauert länger)"
        type: boolean
        default: false
  push:
    paths:
      - "config/engine.json"
      - "engine/**"

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        run: node --test "test/**/*.test.mjs"
      - name: Backtest
        run: node scripts/backtest.mjs ${{ inputs.sensitivity && '--sensitivity' || '' }}
      - name: Zusammenfassung
        run: head -c 900000 reports/backtest.md >> $GITHUB_STEP_SUMMARY
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "backtest: $(date -u +%F)"
            git push
          fi
