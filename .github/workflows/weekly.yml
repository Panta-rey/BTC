name: Wochenlauf

# Montag 03:10 UTC, nach dem Wochenschluss (So 24:00 UTC) und nach dem
# Tagesupdate von Coin Metrics. Ab M2 folgen hier Motoren, Phasen und Signale.

on:
  schedule:
    - cron: "10 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        run: node --test "test/**/*.test.mjs"
      - name: Daten holen
        run: node scripts/fetch.mjs
      - name: Auswerten
        env:
          MODE: weekly
        run: node scripts/build.mjs
      - name: Backtest aktualisieren
        run: node scripts/backtest.mjs
      - name: Zusammenfassung
        run: |
          node -e "
            const j=require('./data/latest.json');
            const l=['## '+j.phase.name+' · Ampel '+j.lamp,'','**'+j.action.text+'**','',
              '| | Score | Zone | Abdeckung |','|---|---|---|---|',
              '| Kauf | '+j.engines.buy.score+' | '+j.engines.buy.zone+' | '+Math.round(j.engines.buy.coverage*100)+' % |',
              '| Verkauf | '+j.engines.sell.score+' | '+j.engines.sell.zone+' | '+Math.round(j.engines.sell.coverage*100)+' % |','',
              'Wochenschluss '+j.week_id+': '+Math.round(j.price.close).toLocaleString('de-CH')+' USD'].join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, l);
          "
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "data: Woche $(node -p "require('./data/latest.json').week_id")"
            git push
          fi
