<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panta Rey · Ampel</title>
<meta name="description" content="Wöchentliche Bitcoin-Zyklus-Ampel: wann kaufen, wann verkaufen, warum.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E16; --card:#141C28; --line:#222D3C; --ink:#E8EDF2; --mut:#7E8B9C;
  --buy:#2DD4A7; --ready:#F0B429; --sell:#F0656A; --info:#5B9DF0; --lamp-off:#111925;
  /* Rahmen bedienbarer Elemente. --line ist mit 1.23:1 dekorativ und genügt
     WCAG 1.4.11 nicht; --edge erreicht 3.01:1 auf Karte und 3.21:1 auf Kachel. */
  --edge:#5A6878;
  --r:14px; --gap:14px; --maxw:440px;
  --num:"Space Grotesk",system-ui,sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
body{padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:var(--maxw);margin:0 auto}
/* Ab 960 px: oben zwei etwa gleich hohe Spalten, darunter ein breiter Block.
   Links die Entscheidung, rechts die Einordnung, unten die Belege. */
@media(min-width:960px){
  .wrap{max-width:1160px}
  #app{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;
       grid-template-areas:"l r" "w w";align-items:start}
  #colL{grid-area:l} #colR{grid-area:r} #colW{grid-area:w}
}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--num);font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}

/* ---------- Kopf ---------- */
header{display:flex;align-items:center;gap:10px;padding:18px 0 14px}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--num);font-weight:700;letter-spacing:.02em}
.mark .hex{color:var(--buy);font-size:18px}
.mark small{font-weight:500;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--mut);background:var(--card)}
.iconbtn:hover{color:var(--ink)}
.iconbtn.busy{color:var(--buy);pointer-events:none}
.iconbtn.busy span{display:inline-block;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.iconbtn.busy span{animation:none}}
.stamp{color:var(--mut);font-size:12.5px;margin:-8px 0 16px}

/* ---------- Karten ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:var(--gap)}
.card h2{font-size:13px;color:var(--mut);font-weight:500;letter-spacing:.04em;margin-bottom:12px}
/* Kopfzeile mit Erklär-Knopf. Der Knopf ist ein echter <button> mit 44 px Tippfläche;
   sichtbar ist nur das Fragezeichen, die Fläche darum ist durchsichtig. */
.h2row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.h2row h2{margin-bottom:0;flex:1}
.qbtn{width:44px;height:44px;margin:-11px -12px -11px 0;background:none;border:0;color:var(--mut);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.qbtn span{width:20px;height:20px;border:1px solid var(--edge);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
.qbtn:hover span{color:var(--ink);border-color:var(--info)}

/* ---------- Ampel ---------- */
.hero{display:flex;gap:18px;align-items:flex-start}
.light{flex:0 0 auto;width:72px;height:188px;border-radius:16px;background:#0B111B;
  border:1px solid var(--line);padding:12px 12px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:center}
.lamp{width:48px;height:48px;border-radius:50%;background:var(--lamp-off);
  box-shadow:inset 0 0 0 1px #1C2736;display:grid;place-items:center;
  transition:background .25s,box-shadow .25s;color:transparent;font-size:15px;font-weight:700}
.lamp.on[data-c=rot]{background:var(--sell);box-shadow:0 0 22px -2px var(--sell),inset 0 0 0 1px var(--sell);color:#2A0A0C}
.lamp.on[data-c=gelb]{background:var(--ready);box-shadow:0 0 22px -2px var(--ready),inset 0 0 0 1px var(--ready);color:#2B2000}
.lamp.on[data-c=gruen]{background:var(--buy);box-shadow:0 0 22px -2px var(--buy),inset 0 0 0 1px var(--buy);color:#042118}
@media (prefers-reduced-motion:reduce){.lamp{transition:none}}
.heroText{flex:1;min-width:0;padding-top:2px}
.phaseName{color:var(--mut);font-size:12.5px;letter-spacing:.04em;margin-bottom:6px}
.action{font-family:var(--num);font-size:21px;line-height:1.25;font-weight:600;margin-bottom:8px}
.amount{font-family:var(--num);font-size:16px;color:var(--buy);font-weight:600;margin-bottom:8px}
.amount.sell{color:var(--sell)}
.why{color:var(--mut);font-size:13px}
.btnrow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--buy);color:#042118;font-weight:600;padding:9px 16px;border-radius:10px;font-size:14px;
  min-height:44px}
.btn.sell{background:var(--sell);color:#2A0A0C}
.btn.ghost{background:none;border:1px solid var(--edge);color:var(--mut);font-weight:500}
.btn.ghost:hover{color:var(--ink)}

/* ---------- Phasenleiste ---------- */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;
  font-size:11.5px;color:var(--mut);background:#0E1520}
.ph b{display:block;font-family:var(--num);font-size:15px;color:var(--mut);font-weight:600}
.ph.done{background:#131B27}
.ph.done b{color:#556478}
.ph.now{border-color:var(--buy);background:rgba(45,212,167,.10)}
.ph.now b,.ph.now{color:var(--ink)}
.ph.now[data-side=sell]{border-color:var(--sell);background:rgba(240,101,106,.10)}

/* ---------- Motoren ---------- */
.eng{margin-bottom:14px}
.eng:last-child{margin-bottom:0}
.engTop{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.engName{font-size:13.5px;font-weight:600}
.engScore{font-family:var(--num);font-size:22px;font-weight:700;margin-left:auto}
.engZone{color:var(--mut);font-size:12px}
.bar{height:9px;border-radius:5px;background:#0E1520;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;display:block}

.tick{position:absolute;top:0;bottom:0;width:1px;background:#2B384A}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
.chip{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.chip.ok{color:var(--buy);border-color:rgba(45,212,167,.35)}
.chip.no{color:var(--mut)}
.chip.warn{color:var(--ready);border-color:rgba(240,180,41,.35)}
.dim{opacity:.55}

/* ---------- Checkliste ---------- */
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.chk li:last-child{border-bottom:0}
.chk .m{flex:0 0 16px;font-weight:700}
.chk .m.y{color:var(--buy)}
.chk .m.n{color:var(--mut)}
.chk .l{flex:1;min-width:0}
.chk .v{font-family:var(--num);color:var(--mut);white-space:nowrap;font-size:13px}
.counter{margin-top:10px;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:5px}
.dots span{width:8px;height:8px;border-radius:50%;background:#1D2736}
.dots span.f{background:var(--ready)}

/* ---------- Zyklus-Uhr ---------- */
.clock{position:relative;height:58px;margin:6px 0 10px}
.clockLine{position:absolute;left:0;right:0;top:26px;height:2px;background:var(--line);border-radius:2px}
.band{position:absolute;top:18px;height:18px;border-radius:4px}
.band.low{background:rgba(45,212,167,.18)}
.band.top{background:rgba(240,101,106,.18)}
.mk{position:absolute;top:10px;width:2px;height:34px;background:var(--mut)}
.mk.now{background:var(--ink);width:2px}
.mk span{position:absolute;top:36px;left:50%;transform:translateX(-50%);font-size:10.5px;
  color:var(--mut);white-space:nowrap}
.mk.edgeL span{left:0;transform:none}
.mk.edgeR span{left:auto;right:0;transform:none}
.mk.now span{color:var(--ink)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{font-family:var(--num)}

/* ---------- Kacheln ---------- */
.famhead{display:flex;align-items:baseline;gap:8px;margin:16px 0 9px;font-size:12.5px;color:var(--mut)}
.famhead b{font-family:var(--num);color:var(--ink);font-size:13.5px;font-weight:600}
.famhead .fs{margin-left:auto;font-family:var(--num)}
.tiles{display:grid;gap:9px}
@media(min-width:760px){.tiles{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:#0E1520;border:1px solid var(--line);border-radius:11px;padding:11px 12px;
  text-align:left;width:100%;display:block}
.tile:hover{border-color:#2E3B4D}
.tt{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;border:1.5px solid var(--mut)}
.dot[data-s=in_zone]{background:currentColor;border-color:currentColor}
.dot[data-s=nahe]{background:linear-gradient(90deg,currentColor 50%,transparent 50%);border-color:currentColor}
.dot[data-s=fehlt]{border-style:dashed}
.tq{color:var(--mut);font-size:11.5px;margin:3px 0 8px}
.tv{display:flex;align-items:baseline;gap:7px}
.tv b{font-family:var(--num);font-size:17px;font-weight:600}
.tv i{font-style:normal;color:var(--mut);font-size:11.5px}
.trend{margin-left:auto;color:var(--mut);font-size:13px}
.mini{height:6px;border-radius:3px;background:#0A111A;margin-top:9px;position:relative;overflow:hidden}
.mini i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;opacity:.75}
.mini u{position:absolute;top:-2px;bottom:-2px;width:1px;background:#3A4A5E}
.tcalc{margin-top:6px;font-size:11.5px;color:var(--mut);font-family:var(--num);letter-spacing:.01em}
.tfoot{margin-top:7px;font-size:11px;color:var(--mut);display:flex;gap:7px;flex-wrap:wrap}
.calc{background:#0A111A;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-top:6px}
.calc .f{font-size:12.5px;color:var(--mut);margin-bottom:7px}
.calc .kv{font-size:12.5px;padding:4px 0}
.tag{border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:10.5px}
.tag.old{color:var(--ready);border-color:rgba(240,180,41,.35)}

details.group{margin-top:6px}
details.group>summary{list-style:none;cursor:pointer;color:var(--mut);font-size:13px;
  padding:11px 0;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary::after{content:"▸";margin-left:auto;transition:transform .2s}
details.group[open]>summary::after{transform:rotate(90deg)}

/* ---------- Position ---------- */
.field{display:flex;align-items:center;gap:10px;padding:7px 0}
.field label{flex:1;font-size:13.5px;color:var(--mut)}
.field input{width:130px;background:#0A111A;border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:7px 10px;font-family:var(--num);text-align:right;font-size:14px}
.trancheRow{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.tr{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;color:var(--mut)}
.tr.due{border-color:var(--ready);color:var(--ready)}
.tr.done{border-color:rgba(45,212,167,.4);color:var(--buy)}
.tr.skip{opacity:.5;text-decoration:line-through}

/* ---------- Verlauf ---------- */
.chartBox{position:relative}
svg.chart{width:100%;height:190px;display:block}
@media(min-width:960px){svg.chart{height:280px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- Bottom-Sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(5,8,13,.72);display:none;z-index:50;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet.open{display:flex}
.sheetIn{background:var(--card);border:1px solid var(--line);border-bottom:0;
  border-radius:18px 18px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));
  width:100%;max-width:var(--maxw);max-height:86vh;overflow:auto}
@media(min-width:720px){.sheet{align-items:center}.sheetIn{border-radius:18px;border-bottom:1px solid var(--line);max-height:80vh;max-width:520px}}
.sheetIn h3{font-size:17px;margin-bottom:4px}
.sheetIn .field label{font-size:13px}
.sheetIn pre{margin:0;overflow-x:auto}
.mrow{border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;background:#0E1520}
.mtop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.mtop b{font-size:13.5px;font-weight:600}
.mtop .badge{font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mut)}
.mtop .badge.now{color:var(--buy);border-color:rgba(45,212,167,.35)}
.mtop .badge.later{color:var(--ready);border-color:rgba(240,180,41,.35)}
.mrow.later{opacity:.72;background:#0C1018}
.mrow .warn{margin-top:7px;font-size:11.5px;color:var(--ready);line-height:1.45}
.mtop .sp{flex:1}
.chartbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;
  border:1px solid var(--edge);border-radius:8px;
  padding:5px 10px;font-size:12px;color:var(--info);text-decoration:none;white-space:nowrap}
.chartbtn:hover{border-color:var(--info)}
.mrow input{width:100%;margin-top:8px;background:#0A111A;border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:8px 10px;font-family:var(--num);font-size:14px;text-align:right}
.mrow .read{margin-top:7px;font-size:11.5px;color:var(--mut)}
.mrow .last{margin-top:5px;font-size:11px;color:var(--buy)}
.sheetIn .sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.sheetIn section{margin-bottom:14px}
.sheetIn section h4{margin:0 0 5px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.03em}
.sheetIn p{margin:0;font-size:13.5px}
.grabber{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}

/* ---------- Banner, Fuss ---------- */
.banner{border-radius:11px;padding:11px 13px;font-size:13px;margin-bottom:var(--gap);
  border:1px solid var(--line);background:#0E1520}
.banner.warn{border-color:rgba(240,180,41,.4);color:var(--ready)}
.banner.info{border-color:rgba(91,157,240,.4);color:var(--info)}
footer{color:var(--mut);font-size:11.5px;padding:18px 0 0;border-top:1px solid var(--line);margin-top:6px}
footer p{margin:0 0 6px}
.skeleton{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><span class="hex">⬡</span>PANTA REY <small>Ampel</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnReload" aria-label="Werte aktualisieren" title="Werte aktualisieren"><span>⟳</span></button>
    <button class="iconbtn" id="btnSettings" aria-label="Einstellungen">⚙</button>
    <a class="iconbtn" href="https://panta-rey.github.io/Panta-Rey-BTC-Dashboard/" aria-label="Zum Cockpit" style="text-decoration:none">↗</a>
  </header>
  <div class="stamp" id="stamp">Lade Wochenstand …</div>
  <div id="banners"></div>
  <main id="app" class="skeleton"><div id="colL"></div><div id="colR"></div><div id="colW"></div></main>
  <footer id="foot"></footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheetIn" id="sheetIn"></div>
</div>

<script type="module">

  bmsb_ext:{n:"Überdehnung über dem Trendband",q:"Rennt der Preis dem Trend davon?",

  pi_cycle:{n:"Pi-Cycle-Nähe",q:"Nähern sich die beiden Top-Linien?",

  rhodl:{n:"RHODL-Ratio",q:"Übernehmen neue Käufer von alten Haltern?",

const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = (s)=>String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = (v,d=0)=>v==null||!isFinite(v)?"–":new Intl.NumberFormat("de-CH",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const usd = (v)=>v==null?"–":nf(Math.round(v));
const dateDE = (s)=>{ if(!s) return "–"; const [y,m,d]=s.split("-");

const clamp=(v,a=0,b=100)=>Math.min(b,Math.max(a,v));

async function loadData(bust=false){
  const url = SRC + (bust ? (SRC.includes("?")?"&":"?") + "t=" + Date.now() : "");

let EV = null;
// Erst laden, wenn der Verlauf in Sichtweite kommt. Die erste Anzeige soll unter
// einer Sekunde bleiben (SPEC 8.5), und die Verlaufsdaten braucht niemand, der nur
// nach dem Handlungssatz schaut. Ohne IntersectionObserver wird sofort geladen.
let histGeladen = false;
async function loadHistory(erzwingen=false){
  if(histGeladen && !erzwingen) return;   // der Aktualisieren-Knopf umgeht die Sperre
  histGeladen = true;
  try{ const r = await fetch("data/phases.json",{cache:"no-store"}); if(r.ok) PH = await r.json(); }catch{}
  try{ const r = await fetch("data/events.json",{cache:"no-store"}); if(r.ok) EV = await r.json(); }catch{}
  if(PH) drawChart();
}
function beobachteVerlauf(){
  const ziel = $("#histCard");
  if(!ziel || typeof IntersectionObserver !== "function"){ loadHistory(); return; }
  const beob = new IntersectionObserver(eintraege=>{
    if(eintraege.some(e=>e.isIntersecting)){ beob.disconnect(); loadHistory(); }
  }, { rootMargin: "400px" });
  beob.observe(ziel);
}

function render(){

  $("#stamp").innerHTML = `Wochenschluss ${esc(dateDE(D.week_id))} · <span class="num">${usd(D.price?.close)} USD</span>` +
    (D.today && D.today.date!==D.week_id ? ` <span class="dim">· Tageswert ${esc(dateDE(D.today.date))}: ${usd(D.today.close)}, vorläufig</span>` : "");

  if(fixture) b.appendChild(el("div","banner info",`Testansicht <b>${esc(fixture)}</b>. Es werden keine echten Daten gezeigt.`));
  if(ageDays>8) b.appendChild(el("div","banner warn",
    `Der letzte Wochenstand ist vom ${esc(dateDE(D.week_id))}. Die Pipeline hat seither nicht geliefert. Im Actions-Tab des Repos nachsehen.`));
  if(D.flags?.data_gap) b.appendChild(el("div","banner warn","Die Daten sind unvollständig. Diese Woche wird nicht ausgewertet, die Zähler bleiben stehen."));
  if(D.flags?.alert==="buy_in_uptrend") b.appendChild(el("div","banner info","Ausserordentliche Kaufgelegenheit: Der Kauf-Motor steht im Aufwärtstrend hoch. Die Reserve ist einsetzbar."));
  if(D.flags?.alert==="sell_in_bear") b.appendChild(el("div","banner info","Der Verkaufs-Motor steht in der Bärenphase hoch. Nur zur Information, keine Aktion."));
  if(D.flags?.cycle_anomaly) b.appendChild(el("div","banner warn","Der Zyklus läuft länger als je zuvor. Die Kernposition trägt, das Bewertungsgate bleibt aktiv."));
  if(D.filters?.sth_rp?.missing) b.appendChild(el("div","banner warn",
    `Der STH-Einstand fehlt, der Trendfilter arbeitet vereinfacht nur mit dem Trendband. Wert in <code>data/manual.json</code> eintragen.`));

  // Links die Entscheidung, rechts die Einordnung, unten die Belege.
  // Auf dem Handy stapelt sich alles in dieser Reihenfolge.
  L.append(hero(), phaseBar(), engines(), checklist());
  R.append(clock(), position());

  foot();
}

function hero(){
  const c = el("div","card");
  const h = el("div","hero");
  const lamp = D.lamp || "aus";
  h.appendChild(el("div","light",
    ["rot","gelb","gruen"].map(k=>
      `<span class="lamp ${lamp===k?"on":""}" data-c="${k}" aria-hidden="true">${{rot:"↓",gelb:"!",gruen:"↑"}[k]}</span>`
    ).join("")));
  h.firstChild.setAttribute("role","img");
  h.firstChild.setAttribute("aria-label",
    lamp==="aus" ? "Ampel aus: nichts tun" : `Ampel ${lamp}: ${PHASES[D.phase.id].s}`);

  const t = el("div","heroText");
  t.appendChild(el("div","phaseName",`Phase ${D.phase.id} · ${esc(D.phase.name)} · seit ${D.phase.weeks} Wochen`));
  const act = el("div","action",esc(D.action?.text||"–")); act.setAttribute("aria-live","polite");
  t.appendChild(act);

  const amt = trancheAmount(D.action?.tranche);
  if(amt) t.appendChild(el("div","amount"+(D.action.tranche[0]==="S"?" sell":""),esc(amt)));
  t.appendChild(el("div","why",esc(why())));

  const row = el("div","btnrow");
  const tr = D.action?.tranche;
  if(tr && !DONE[key(tr)]){
    const b1 = el("button","btn"+(tr[0]==="S"?" sell":""),"Erledigt");
    b1.onclick = ()=>markTranche(tr,"done");
    const b2 = el("button","btn ghost","Überspringen");
    b2.onclick = ()=>markTranche(tr,"skip");
    row.append(b1,b2);
  } else if(tr && DONE[key(tr)]){
    row.appendChild(el("span","chip ok",`${TR[tr]} erledigt am ${esc(dateDE(DONE[key(tr)].date))}`));
  }
  if(row.children.length) t.appendChild(row);
  h.appendChild(t); c.appendChild(h);
  return c;
}

function why(){
  if(D.flags?.data_gap) return "Die Auswertung wurde ausgesetzt.";
  const e = D.engines[D.engines.active];
  const gates = Object.entries(e.gates||{}).filter(([k])=>k!=="e2_min");
  const open = gates.filter(([,v])=>v).map(([k])=>k);
  const side = D.engines.active==="buy"?"Kauf":"Verkauf";
  const base = `${side}-Motor ${e.score} von 100, ${e.confluence.in_zone} Indikatoren in Zone aus ${e.confluence.families} Familien.`;
  return open.length ? base+` Offene Tore: ${open.join(", ")}.` : base+" Kein Tor offen.";
}

// ---------------------------------------------------------- Phasenleiste
function phaseBar(){
  const c = el("div","card"); c.appendChild(el("h2",null,"Zyklusphase"));
  const g = el("div","phases");
  for(const id of [1,2,3,4]){
    const now = id===D.phase.id;
    const done = passed(id);
    const d = el("div","ph"+(now?" now":done?" done":""),
      `<b>${id}</b>${esc(PHASES[id].n)}${now?`<br><span class="num">${D.phase.weeks} W</span>`:""}`);
    if(now) d.dataset.side = (id===3?"sell":"buy");
    g.appendChild(d);
  }
  c.appendChild(g);
  return c;
}
// Welche Phasen der laufende Zyklus schon durchlaufen hat (④→①→②→③)
function passed(id){
  const order=[4,1,2,3], cur=order.indexOf(D.phase.id), me=order.indexOf(id);
  return me<cur;
}

// ---------------------------------------------------------- Zyklus-Uhr
function clock(){
  const cc = D.cycle_clock||{};
  const c = el("div","card"); c.appendChild(el("h2",null,"Zyklus-Uhr"));
  const t0 = Date.parse(cc.ath_date+"T00:00:00Z");
  // Die Achse muss bis hinter das Top-Fenster reichen (Halving + 640 Tage),
  // sonst wird der wichtigste Teil abgeschnitten.
  const tH = Date.parse((cc.next_halving?.estimate||"2028-04-14")+"T00:00:00Z");
  const t1 = tH + 720*86400000;
  const x = (ms)=>clamp(((ms-t0)/(t1-t0))*100,0,100);
  const box = el("div","clock",'<div class="clockLine"></div>');
  const band=(a,b,cls)=>{const d=el("div","band "+cls);d.style.left=x(a)+"%";d.style.width=Math.max(1,x(b)-x(a))+"%";box.appendChild(d);};
  band(t0+9*30.44*86400000, t0+16*30.44*86400000, "low");
  band(tH+450*86400000, tH+640*86400000, "top");
  const mark=(ms,label,now)=>{
    const pos=x(ms);
    const m=el("div","mk"+(now?" now":"")+(pos<12?" edgeL":pos>88?" edgeR":""),`<span>${esc(label)}</span>`);
    m.style.left=pos+"%"; box.appendChild(m);
  };
  mark(t0,"letztes Hoch");
  mark(tH,"Halving");
  mark(Date.parse(D.week_id+"T00:00:00Z"),"heute",true);
  c.appendChild(box);

  const kv=(a,b)=>c.appendChild(el("div","kv",`<span>${esc(a)}</span><span>${esc(b)}</span>`));
  kv("Allzeithoch",`${usd(cc.ath)} USD am ${dateDE(cc.ath_date)}`);
  kv("Seit dem Hoch",`${cc.days_since_ath} Tage · ${nf(cc.days_since_ath/30.44,1)} Monate`);
  kv("Letztes Halving",`${dateDE(cc.last_halving)} · ${cc.days_since_last_halving} Tage`);
  if(cc.next_halving) kv("Nächstes Halving",`geschätzt ${dateDE(cc.next_halving.estimate)} · ${nf(cc.next_halving.blocks_left)} Blöcke`);
  c.appendChild(el("div","legend",
    '<span><i style="background:rgba(45,212,167,.5)"></i>Tief-Fenster</span>' +
    '<span><i style="background:rgba(240,101,106,.5)"></i>Top-Fenster</span>'));
  c.appendChild(el("div","why","Die farbigen Felder zeigen, wo die Tiefs und Hochs der vier bisherigen Zyklen lagen: 9 bis 16 Monate nach dem Hoch, und 450 bis 640 Tage nach dem Halving. Muster, keine Prognose."));
  return c;
}

// ---------------------------------------------------------- Position
function position(){
  const c = el("div","card"); c.appendChild(el("h2",null,"Deine Position · nur auf diesem Gerät"));
  const mk=(label,k,ph)=>{
    const f=el("div","field",`<label for="f_${k}">${esc(label)}</label>`);
    const i=el("input"); i.id="f_"+k; i.type="number"; i.step="any"; i.placeholder=ph;
    i.value = POS[k] ?? ""; i.inputMode="decimal";
    i.oninput=()=>{ POS[k]= i.value===""?null:parseFloat(i.value); store.set("position",POS); refreshAmounts(); };
    f.appendChild(i); return f;
  };
  c.appendChild(mk("BTC-Bestand","btc","0.5"));
  c.appendChild(mk("Cash in USD","cash","10000"));
  c.appendChild(mk("Kernposition in Prozent","core_pct","40"));

  // Vier Zustände: erledigt, übersprungen, diese Woche fällig, in einer früheren
  // Woche ausgelöst. Ein gesetztes Datum allein heisst nicht "fällig": die Liste
  // trägt die Tranchen des laufenden Zyklus bis zum nächsten Phasenwechsel mit.
  const row = el("div","trancheRow");
  for(const t of ["B1","B2","B3","S1","S2","S3"]){
    const ausgeloest = D.tranches?.[t] || null;
    const st = DONE[key(t)];
    let cls = "tr", text = `${TR[t]} · offen`;
    if(st?.state==="done"){ cls="tr done"; text=`${TR[t]} ✓`; }
    else if(st?.state==="skip"){ cls="tr skip"; text=TR[t]; }
    else if(ausgeloest===D.week_id){ cls="tr due"; text=`${TR[t]} · fällig`; }
    else if(ausgeloest){ text=`${TR[t]} · ${dateDE(ausgeloest).replace(/ \d{4}$/, "")}`; }
    const chip = el("span",cls,esc(text));
    if(ausgeloest) chip.title = `Ausgelöst am ${dateDE(ausgeloest)}`;
    row.appendChild(chip);
  }
  c.appendChild(row);
  if(POS.btc==null && POS.cash==null)
    c.appendChild(el("div","why","Trag deinen Bestand ein, dann rechnet die Seite die Tranchen in BTC und USD aus. Die Angaben verlassen dieses Gerät nicht."));
  return c;
}
function trancheAmount(t){
  if(!t) return null;
  const core=(POS.core_pct??40)/100;
  if(t[0]==="B"){
    if(POS.cash==null) return null;
    const share=(POS.split_buy||[34,33,33])[+t[1]-1]/100;
    const usdAmt=POS.cash*share;
    return `≈ ${usd(usdAmt)} USD · ${nf(usdAmt/D.price.close,4)} BTC`;
  }
  if(POS.btc==null) return null;
  const tradable=POS.btc*(1-core);
  const share=(POS.split_sell||[34,33,33])[+t[1]-1]/100;
  const qty=tradable*share;
  return `≈ ${nf(qty,4)} BTC · ${usd(qty*D.price.close)} USD · Kernposition ${nf(POS.btc*core,4)} BTC bleibt`;
}
function refreshAmounts(){ try{ render(); }catch(e){ console.error(e); } }
const key=(t)=>`${D.phase.cycle_no||0}:${t}`;

function markTranche(t,state){
  DONE[key(t)] = {state,date:D.week_id,price:D.price.close};
  store.set("tranches",DONE);
  JOURNAL.unshift({date:new Date().toISOString().slice(0,10),week:D.week_id,
    text:`${TR[t]} ${state==="done"?"erledigt":"übersprungen"} bei ${usd(D.price.close)} USD`});
  store.set("journal",JOURNAL);
  render();
}

function tiles(){

  ctx.appendChild(c); wrap.appendChild(ctx);

}
function group(side,open){
  const e = D.engines[side];
  const title = side==="buy"?"Indikatoren des Kauf-Motors":"Indikatoren des Verkaufs-Motors";
  if(!open){
    const d = el("details","group");

  const c = el("div","card"); c.appendChild(el("h2",null,title));
  c.appendChild(famList(side,e));

function famList(side,e){
  const box = el("div");
  for(const [fid,f] of Object.entries(e.families)){
    const head = el("div","famhead",
      `<b>${esc(f.label)}</b> Gewicht ${f.weight} %<span class="fs">${f.available?f.score:"nicht verfügbar"}</span>`);
    box.appendChild(head);
    const g = el("div","tiles");
    for(const id of Object.keys(f.members)) g.appendChild(tile(id,side));
    box.appendChild(g);
  }
  return box;
}
function tile(id,side){
  const s = D.scores?.[id]||{}, ind = D.indicators?.[id]||{};
  const meta = I[id]||{n:id,q:""};
  const st = side==="buy"?(s.state_buy||"fehlt"):(s.state_sell||"fehlt");
  const score = side==="buy"?s.score_buy:s.score_sell;
  const col = side==="buy"?"var(--buy)":"var(--sell)";
  const b = el("button","tile");
  b.setAttribute("aria-label",`${meta.n}: ${ind.missing?"keine Daten":nf(ind.value,2)+" "+(ind.unit||"")}`);
  const dot = `<span class="dot" data-s="${esc(st)}" style="color:${col}"></span>`;
  b.appendChild(el("div","tt",dot+esc(meta.n)));
  b.appendChild(el("div","tq",esc(meta.q)));
  const val = ind.missing ? "–" : (typeof ind.value==="string" ? esc(ind.value) : nf(ind.value, Math.abs(ind.value)>=1000?0:2));
  const tv = el("div","tv",`<b>${val}</b><i>${esc(ind.unit||"")}</i>`);
  if(s.pct!=null) tv.appendChild(el("span","trend",`${Math.round(s.pct)}. Perzentil`));
  b.appendChild(tv);
  const mini = el("div","mini",`<i style="width:${clamp(score??0)}%;background:${col}"></i>`);
  mini.appendChild(el("u")).style.left="70%";
  b.appendChild(mini);
  // Kompakte Herkunftszeile. Sie kommt fertig aus der Pipeline, damit hier nicht
  // geraten werden muss, welcher Rechenschritt zwischen den Zahlen steht.
  if(ind.source_calc?.compact) b.appendChild(el("div","tcalc",esc(ind.source_calc.compact)));
  const foot = el("div","tfoot");
  foot.appendChild(el("span",null,score==null?"zählt nicht":`Score ${score}`));
  if(ind.stale) foot.appendChild(el("span","tag old",`alt · ${esc(dateDE(ind.as_of))}`));
  if(ind.source) foot.appendChild(el("span","tag",esc(ind.source)));
  b.appendChild(foot);
  b.onclick = ()=>sheet(id,side);
  return b;
}

function motorSheet(){
  const seite = D.engines.active, e = D.engines[seite], cf = e.confluence||{};
  const andere = seite==="buy" ? D.engines.sell : D.engines.buy;
  const nam = seite==="buy" ? "Kauf" : "Verkauf";

  // Familien mit echten Werten auflisten
  const fam = Object.values(e.families||{}).map(f=>
    `<div class="kv"><span>${esc(f.label)} · ${Object.keys(f.members||{}).length} Indikatoren</span>` +
    `<span>Gewicht ${f.weight} · ${f.available?f.score:"fehlt"}</span></div>`).join("");

  // Welche Indikatoren stehen gerade in Zone, und welcher ist am nächsten dran?
  const alle = [];
  for(const f of Object.values(e.families||{}))
    for(const id of Object.keys(f.members||{})){
      const sc = seite==="buy" ? D.scores?.[id]?.score_buy : D.scores?.[id]?.score_sell;
      if(sc!=null) alle.push({ id, n: I[id]?.n||id, sc, f: f.label });
    }
  alle.sort((a,b)=>b.sc-a.sc);
  // Welche in Zone stehen, sagen die Daten selbst (confluence.ids). Nicht nachrechnen:
  // die Engine zählt auch Indikatoren mit, die keiner Familie dieser Seite angehören.
  const inZoneIds = new Set(cf.ids||[]);
  const drin = (cf.ids||[]).map(id=>({ n: I[id]?.n||id }));
  const knapp = alle.filter(x=>!inZoneIds.has(x.id) && x.sc<70).slice(0,2);

  infoSheet(`${nam}-Motor`, `${e.score} von 100`, [
    ["Was die Zahl ist",
     `<p>Ein Durchschnitt aus allen Indikatoren, von 0 bis 100. Hoch heisst: viele Anzeichen sprechen für ${seite==="buy"?"einen günstigen Einstieg":"ein Überhitzen"}. Der ${seite==="buy"?"Verkaufs":"Kauf"}-Motor darunter (${andere.score}) läuft nur mit und löst nichts aus, weil die Phase bestimmt, welcher gilt.</p>
      <div class="calc">
        <div class="kv"><span>0–39</span><span>ruhig</span></div>
        <div class="kv"><span>40–59</span><span>bereit machen</span></div>
        <div class="kv"><span>60–79</span><span>Zone erreicht</span></div>
        <div class="kv"><span>80–100</span><span>Extrem</span></div>
      </div>`],

    ["Familien: die Gruppen darunter",
     `<p>Indikatoren, die dasselbe messen, bilden eine Familie. Erst wird innerhalb einer Familie gemittelt, dann werden die Familien nach Gewicht zusammengezogen. So kann eine Gruppe mit vier Indikatoren die Sache nicht vierfach zählen. Deine Familien gerade:</p>
      <div class="calc">${fam}</div>
      <p>Fehlt eine Familie ganz, wird sie <b>herausgerechnet</b> und nicht als Null gewertet. Die anderen wiegen dann entsprechend schwerer.</p>`],

    ["In Zone: ab 70 Punkten",
     `<p>Jeder einzelne Indikator hat auch einen Wert von 0 bis 100. Ab 70 gilt er als „in Zone", also als deutliches Anzeichen. ` +
      (drin.length ? `Gerade in Zone: <b>${drin.map(x=>esc(x.n)).join(", ")}</b>.` : `Gerade ist keiner in Zone.`) +
      (knapp.length ? ` Am nächsten dran: ${knapp.map(x=>`${esc(x.n)} mit ${Math.round(x.sc)}`).join(", ")}.` : "") + `</p>`],

    ["Warum der Durchschnitt allein nicht reicht",
     `<p>Die Zeile <b>„${cf.in_zone??0} von ${cf.need_indicators??0} in Zone · ${cf.families??0} von ${cf.need_families??0} Familien"</b> ist eine eigene Bedingung. Ein hoher Durchschnitt könnte allein vom Preisverfall kommen. Gefordert sind deshalb mehrere Indikatoren aus <b>verschiedenen</b> Familien gleichzeitig. Erst wenn Preis, Halterverhalten und Miner dasselbe sagen, zählt es.</p>`],

    ["Tor A und Tor B",
     `<p>Zusätzlich muss ein Tor offen sein, sonst passiert nichts, egal wie hoch der Score steht. Die Tore sind Vorbedingungen, keine Punkte.</p>
      <div class="calc">
        <div class="kv"><span>Tor A · Kapitulation</span><span>${e.gates?.A?"offen ✓":"zu ✗"}</span></div>
        <div class="kv"><span>Tor B · flaches Tief</span><span>${e.gates?.B?"offen ✓":"zu ✗"}</span></div>
      </div>
      <p><b>Tor A</b> ist der klassische Ausverkauf: Bitcoin notiert unter dem Durchschnittspreis aller Käufer. <b>Tor B</b> gibt es, weil die Tiefs flacher werden und Tor A zuletzt nie mehr aufging. Es verlangt stattdessen vier Dinge gleichzeitig: mindestens ein halbes Jahr seit dem Hoch, mindestens 40 % darunter, nahe am 200-Wochen-Schnitt, und viele Coins unter Wasser.</p>`],
  ]);
}

// Fokus im Sheet halten und beim Schliessen dorthin zurückgeben, wo er herkam.
// Ohne das landet die Tastatur hinter dem Overlay und verliert nach dem Schliessen
// ihre Stelle in der Seite (WCAG 2.1.2 und 2.4.3).
let sheetReturn = null;
function fokussierbare(){
  return [...$("#sheet").querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
}
function openSheet(first){
  sheetReturn = document.activeElement;
  (first || fokussierbare()[0])?.focus();
}
function closeSheet(){
  const sh=$("#sheet");
  if(!sh.classList.contains("open")) return;
  sh.classList.remove("open");
  if(sheetReturn && document.contains(sheetReturn)) sheetReturn.focus();
  sheetReturn = null;
}
$("#sheet").addEventListener("keydown", e=>{
  if(e.key!=="Tab") return;
  const f = fokussierbare();
  if(!f.length) return;
  const erste = f[0], letzte = f.at(-1);
  if(e.shiftKey && document.activeElement===erste){ e.preventDefault(); letzte.focus(); }
  else if(!e.shiftKey && document.activeElement===letzte){ e.preventDefault(); erste.focus(); }
});
$("#sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

function history(){
  const c = el("div","card"); c.id="histCard";

function drawChart(){
  const box = $("#histCard .chartBox"); if(!box||!PH) return;
  const rows = PH.rows.filter(r=>r[1]>0);
  if(!rows.length) return;
  const W=400,H=190,P={l:2,r:2,t:8,b:14};
  const xs=(i)=>P.l+(i/(rows.length-1))*(W-P.l-P.r);
  const lo=Math.log10(Math.min(...rows.map(r=>r[1]))), hi=Math.log10(Math.max(...rows.map(r=>r[1])));
  const ys=(v)=>P.t+(1-(Math.log10(v)-lo)/(hi-lo))*(H-P.t-P.b);
  const COL={1:"rgba(45,212,167,.14)",2:"transparent",3:"rgba(240,101,106,.14)",4:"rgba(34,45,60,.5)"};
  let bands="",start=0;
  for(let i=1;i<=rows.length;i++){
    if(i===rows.length||rows[i][2]!==rows[start][2]){
      bands+=`<rect x="${xs(start).toFixed(1)}" y="${P.t}" width="${Math.max(.5,xs(i-1)-xs(start)).toFixed(1)}" height="${H-P.t-P.b}" fill="${COL[rows[start][2]]}"/>`;
      start=i;
    }
  }
  const path = rows.map((r,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(r[1]).toFixed(1)}`).join("");
  // Alle Transaktionen der Historie aus events.json, nicht nur die des laufenden Zyklus.
  const trades = new Map();
  for(const e of (EV?.events||[])){
    const ts = [e.tranche, ...(e.tranches||[])].filter(Boolean);
    for(const t of ts) trades.set(e.week_id+":"+t, {w:e.week_id, up:t[0]==="B"});
  }
  if(!trades.size) for(const [t,w] of Object.entries(D.tranches||{})) if(w) trades.set(w+":"+t,{w,up:t[0]==="B"});
  // Mehrere Tranchen in derselben Woche nur einmal zeichnen
  const seen = new Set();
  const marks = [...trades.values()].map(({w,up})=>{
    const key=w+(up?"B":"S"); if(seen.has(key)) return ""; seen.add(key);
    const i=rows.findIndex(r=>r[0]===w); if(i<0) return "";
    const y=ys(rows[i][1]);
    return `<path d="M${xs(i).toFixed(1)},${(y+(up?7:-7)).toFixed(1)} l-4,${up?5:-5} l8,0 z" fill="${up?"var(--buy)":"var(--sell)"}"/>`;
  }).join("");
  try{
  box.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
      aria-label="Bitcoin-Kurs seit ${rows[0][0]} mit den Zyklusphasen als Hintergrund">
      ${bands}<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.1" vector-effect="non-scaling-stroke"/>${marks}</svg>
    <div class="legend">
      <span><i style="background:rgba(45,212,167,.5)"></i>Akkumulation</span>
      <span><i style="background:rgba(240,101,106,.5)"></i>Verteilung</span>
      <span><i style="background:rgba(34,45,60,.9)"></i>Abwärtstrend</span>
      <span>▲ Kauf ▼ Verkauf · ${trades.size} Tranchen</span>
    </div>
    <div class="why">Logarithmisch, ${rows.length} Wochen ab ${esc(dateDE(rows[0][0]))}.</div>`;
  }catch(e){ box.innerHTML = '<div class="why">Der Verlauf konnte nicht gezeichnet werden.</div>'; console.error(e); }
}

  { k:"lth_net_position_change", n:"LTH-Positionsänderung 30 T", u:"BTC", sofort:false, rang:"zurückgestellt", motor:"Verkauf",
    chart:"LTH Supply Net Position Change (30-day)",
    url:"https://charts.checkonchain.com/btconchain/supply/lthnetposchange_0/lthnetposchange_0_light.html",
    read:"Wert mit Vorzeichen eintragen. Negativ bedeutet Abgabe der Langzeithalter. Immer dieselbe Einheit verwenden, damit die Reihe vergleichbar bleibt.",
    warn:"Zurückgestellt, aus demselben Grund wie die RHODL-Ratio: Sie gehört zur Familie „Halterverhalten\" des Verkaufs-Motors und hebt damit die Schwelle von Weg E2." },
];

function manualPanel(){
  const box = el("div");
  box.appendChild(el("p",null,
    `Fünf Kennzahlen gibt es nur bei BGeometrics. Die ersten zwei trägst du monatlich nach:
     Das Angebot im Gewinn allein hebt die Abdeckung des Kauf-Motors von 80 auf 100 Prozent,
     der STH-Einstand schaltet die Nachkauf-Chance frei. Die übrigen drei sind bewusst
     zurückgestellt, die Begründung steht jeweils an der Kachel. Eine Erinnerung kommt
     jeden Monatsanfang als GitHub-Issue.`));
  const draft = store.get("manual_draft",{});
  const series = D.manual?.series || {};
  const rows = el("div");
  for(const m of MANUAL){
    const r = el("div","mrow" + (m.rang==="zurückgestellt" ? " later" : ""));
    const top = el("div","mtop",
      `<b>${esc(m.n)}</b>` +
      (m.u ? `<span class="badge">${esc(m.u)}</span>` : "") +
      `<span class="badge${m.rang==="monatlich"?" now":" later"}">${m.rang==="monatlich"?"monatlich eintragen":"zurückgestellt"}</span>` +
      `<span class="badge">${esc(m.motor)}-Motor</span>` +
      `<span class="sp"></span>`);
    const a = el("a","chartbtn","↗ Chart öffnen");
    a.href = m.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.title = m.chart;
    top.appendChild(a);
    r.appendChild(top);

    const i = el("input"); i.id="m_"+m.k; i.type="number"; i.step="any"; i.inputMode="decimal";
    i.placeholder = m.rang==="monatlich" ? "Wert eintragen" : "nur eintragen, wenn bewusst gewollt";
    i.value = draft[m.k] ?? "";
    i.setAttribute("aria-label", m.n + (m.u ? " in " + m.u : ""));
    i.oninput = ()=>{ draft[m.k] = i.value; store.set("manual_draft",draft); snippet(); };
    r.appendChild(i);
    if(m.warn) r.appendChild(el("div","warn",esc(m.warn)));
    r.appendChild(el("div","read",esc(m.read)));
    const have = series[m.k] || [];
    if(have.length) r.appendChild(el("div","last",
      `${have.length} Lesung(en) hinterlegt, zuletzt ${esc(dateDE(have.at(-1).d))}: ${nf(have.at(-1).v, 2)}`));
    rows.appendChild(r);
  }
  box.appendChild(rows);

  const out = el("pre","calc"); out.style.whiteSpace="pre-wrap"; out.style.fontSize="11.5px";
  box.appendChild(out);
  // Speichern läuft über ein vorbereitetes GitHub-Issue. Ein Workflow prüft die
  // Werte und schreibt sie nach data/manual.json. Die Seite selbst kann das nicht:
  // sie ist statisch und liegt im Browser, die Auswertung läuft in der Pipeline.
  const row = el("div","btnrow");
  const save = el("a","btn","✓ Speichern");
  save.target="_blank"; save.rel="noopener"; save.style.textDecoration="none";
  const cp = el("button","btn ghost","Block kopieren");
  cp.onclick = async ()=>{ try{ await navigator.clipboard.writeText(out.textContent); cp.textContent="Kopiert"; setTimeout(()=>cp.textContent="Block kopieren",1600); }
    catch{ cp.textContent="Kopieren nicht erlaubt"; } };
  const ed = el("a","btn ghost","Datei von Hand bearbeiten");
  ed.href="https://github.com/Panta-rey/Panta-Rey-BTC-Ampel/edit/main/data/manual.json";
  ed.target="_blank"; ed.rel="noopener"; ed.style.textDecoration="none";
  row.append(save,cp,ed); box.appendChild(row);
  box.appendChild(el("div","why",
    `Speichern öffnet GitHub mit einem fertig ausgefüllten Eintrag. Dort nur noch auf
     „Create“ tippen, dann trägt ein Workflow die Werte innerhalb einer Minute in
     <code>data/manual.json</code> ein und meldet sich zurück. Die Seite kann die Datei
     nicht selbst ändern: Sie ist statisch, die Auswertung läuft in der Pipeline.`));

  function snippet(){
    const week = D.week_id;
    // Immer alle fünf Reihen ausgeben, auch die leeren. Sonst würden beim Einfügen
    // die bestehenden Lesungen der anderen Kennzahlen verloren gehen.
    const lines = [];
    let neu = 0;
    for(const m of MANUAL){
      const have = (series[m.k] || []).filter(r => r.d !== week);
      const v = parseFloat(draft[m.k]);
      const list = isFinite(v) ? [...have, { d: week, v }] : have;
      if(isFinite(v)) neu++;
      lines.push(`  "${m.k}": [${list.length ? "\n" + list.map(r=>`    { "d": "${r.d}", "v": ${r.v} }`).join(",\n") + "\n  " : ""}]`);
    }
    out.textContent = `{\n  "_hinweis": "Werte aus charts.checkonchain.com. Eine Lesung gilt 30 Tage. Siehe SPEC.md 3.5.",\n${lines.join(",\n")}\n}`;
    cp.textContent = neu ? `Block kopieren (${neu} neu)` : "Block kopieren";
    save.textContent = neu ? `✓ Speichern (${neu})` : "✓ Speichern";
    save.style.opacity = neu ? "1" : ".45";
    save.style.pointerEvents = neu ? "auto" : "none";
    const issueBody = `Manuelle Kennzahlen, abgelesen bei Checkonchain.\n\n\`\`\`json\n${out.textContent}\n\`\`\`\n`;
    save.href = "https://github.com/Panta-rey/Panta-Rey-BTC-Ampel/issues/new?"
      + new URLSearchParams({ title: `manual: ${week}`, body: issueBody, labels: "manual" }).toString();
  }
  snippet();

  const have = D.manual?.readings || {};
  const n = Object.values(have).reduce((a,b)=>a+b,0);
  box.appendChild(el("div","why", n
    ? `Aktuell wirken ${n} manuelle Lesung(en). Eine Lesung gilt ${D.manual?.max_age_days ?? 30} Tage, danach gilt der Wert als alt.`
    : "Derzeit sind keine manuellen Werte hinterlegt."));
  return box;
}

$("#btnSettings").onclick=()=>{
  const inner=$("#sheetIn");
  inner.innerHTML=`<div class="grabber"></div><h3 id="sheetTitle">Einstellungen</h3>
    <div class="sub">Konfiguration ${esc(D.config_version||D.stage||"")} · Daten ${esc(D.week_id)}</div>`;
  const mv=el("section"); mv.appendChild(el("h4",null,"Fehlende Kennzahlen von Hand nachtragen"));
  mv.appendChild(manualPanel()); inner.appendChild(mv);
  const s=el("section",null,`<h4>Speicher</h4><p>Bestand, Tranchen und Journal liegen ausschliesslich in diesem Browser.
    Safari auf iOS löscht den Speicher nach längerer Inaktivität, deshalb lohnt sich ein jährliches Backup.</p>`);
  inner.appendChild(s);
  const r=el("div","btnrow");
  const ex=el("button","btn ghost","Backup exportieren"); ex.onclick=exportBackup;
  const rs=el("button","btn ghost","Alles löschen");
  rs.onclick=()=>{ if(confirm("Bestand, Tranchen und Journal auf diesem Gerät löschen?")){
    ["position","tranches","journal"].forEach(k=>localStorage.removeItem("zy_"+k));
    POS=store.get("position",{btc:null,cash:null,core_pct:40}); DONE={}; JOURNAL=[]; closeSheet(); render(); } };
  r.append(ex,rs); inner.appendChild(r);
  const cl=el("button","btn ghost","Schliessen"); cl.onclick=closeSheet; inner.appendChild(cl);
  $("#sheet").classList.add("open"); cl.focus();
};

function foot(){
  $("#foot").innerHTML =
    `<p>${(D.attribution||[]).map(esc).join(" · ")}</p>
     <p>Konfiguration ${esc(D.config_version||"–")} · Stand ${esc(dateDE(D.week_id))} ·
     <a href="https://github.com/Panta-rey/Panta-Rey-BTC-Ampel">Quellcode</a></p>
     <p>Keine Anlageberatung. Das Modell beruht auf vier Zyklen und kann falsch liegen.</p>`;
}
